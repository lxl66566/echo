[package]
name         = "echo-core"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
description  = "Echo instant-replay audio engine: Opus ring buffer, Ogg Opus muxer, JNI bridge"
repository   = "https://github.com/lxl66566/Echo"
license      = "MIT OR Apache-2.0"
keywords     = ["opus", "ogg", "android", "audio", "recording"]
categories   = ["multimedia::audio"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni       = "0.21"
ogg       = "0.9"
opusic-c  = "1.6"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]

[lints.clippy]
all                     = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
cast_lossless           = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap      = "allow"
cast_precision_loss     = "allow"
cast_sign_loss          = "allow"
doc_markdown            = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
pedantic                = { level = "warn", priority = -1 }
similar_names           = "allow"
wildcard_imports        = "allow"

[lints.rust]
unsafe_code           = "allow"
unused_qualifications = "warn"

[profile.release]
lto           = "fat"
codegen-units = 1
opt-level     = 3
panic         = "abort"
strip         = true
